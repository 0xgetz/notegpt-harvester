[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notegpt-harvester"
version = "1.0.0"
description = "Bulk NoteGPT account creator, token/cookie harvester and 9Router connector."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "notegpt-harvester contributors" }]
keywords = ["notegpt", "9router", "harvester", "automation", "openai-compatible", "ai-router"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
ngharvest = "notegpt_harvester.cli:main"

[project.urls]
Homepage = "https://github.com/0xgetz/notegpt-harvester"
Repository = "https://github.com/0xgetz/notegpt-harvester"

[tool.hatch.build.targets.wheel]
packages = ["src/notegpt_harvester"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
